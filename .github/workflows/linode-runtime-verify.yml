name: Linode Runtime Verify
on: []

# Disabled temporarily.
#  - Manual remote verification is not available while this workflow is paused.
#  - Re-enable by restoring the workflow_dispatch inputs block below:
#      on:
#        workflow_dispatch:
#          inputs:
#            ... existing inputs ...

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remote runtime verification on Linode
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            REPO_PATH="${{ github.event.inputs.repo_path || '/root/repositories/zoho-books-mcp' }}"
            export ZOHO_MCP_REPO_PATH="$REPO_PATH"
            export ZOHO_MCP_CHECK_LOGROTATE="${{ github.event.inputs.check_logrotate == 'true' && '1' || '0' }}"
            export ZOHO_MCP_SYSTEMCTL_BIN="${{ github.event.inputs.systemctl_bin }}"
            cd "$REPO_PATH"
            ./scripts/check-systemd-deploy.sh
